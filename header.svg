<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F2C"/>
      <stop offset="1" stop-color="#060B1E"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16417C"/>
      <stop offset="0.5" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#48CAE4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#16417C" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="250" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .blink { animation: bl 1.1s steps(2, start) infinite; }
    @keyframes bl { to { visibility: hidden; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="250" fill="url(#bg)"/>
    <rect width="1200" height="250" fill="url(#grid)"/>

    <!-- HUD corners -->
    <text class="mono" x="28" y="38" font-size="15" fill="#48CAE4" fill-opacity="0.85">$ canbus --listen</text>
    <circle cx="1166" cy="33" r="4" fill="#00B4D8">
      <animate attributeName="fill-opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="1148" y="38" font-size="15" fill="#48CAE4" fill-opacity="0.85" text-anchor="end">node 0x50</text>

    <!-- name -->
    <text class="mono" x="600" y="122" font-size="54" font-weight="700" letter-spacing="7"
          text-anchor="middle" fill="url(#trace)">HEITOR RICARDO<tspan class="blink" fill="#00B4D8">_</tspan></text>
    <text class="mono" x="600" y="156" font-size="17" letter-spacing="3"
          text-anchor="middle" fill="#8ECAE6" fill-opacity="0.8">// engineering things that move</text>

    <!-- telemetry trace: dim base layer -->
    <path id="signal" d="M0 205 H55 V183 H95 V205 H145 L160 173 L175 205 H235 V189 H275 V205 H330 L352 143 L368 221 L382 205 H450 V183 H492 V205 H550 L565 175 L580 205 H642 V189 H684 V205 H745 L768 153 L784 217 L798 205 H865 V183 H905 V205 H962 L978 171 L994 205 H1052 V189 H1094 V205 H1200"
          stroke="url(#trace)" stroke-opacity="0.4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- traveling pulse on the same trace -->
    <path d="M0 205 H55 V183 H95 V205 H145 L160 173 L175 205 H235 V189 H275 V205 H330 L352 143 L368 221 L382 205 H450 V183 H492 V205 H550 L565 175 L580 205 H642 V189 H684 V205 H745 L768 153 L784 217 L798 205 H865 V183 H905 V205 H962 L978 171 L994 205 H1052 V189 H1094 V205 H1200"
          stroke="#48CAE4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
          filter="url(#glow)" pathLength="100" stroke-dasharray="12 88">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
